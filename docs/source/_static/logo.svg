<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 280" width="100%" height="100%">
  <defs>
    <!-- Filter for high legibility outline (multi-theme support for text) -->
    <filter id="theme-outline" x="-10%" y="-10%" width="120%" height="120%">
      <feFlood flood-color="#ffffff" flood-opacity="0.9" result="bg"/>
      <feMorphology operator="dilate" radius="1.5" in="SourceAlpha" result="outline"/>
      <feComposite in="bg" in2="outline" operator="in" result="coloredOutline"/>
      <feMerge>
        <feMergeNode in="coloredOutline"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Thinner outline for the small subtitle -->
    <filter id="subtitle-outline" x="-10%" y="-10%" width="120%" height="120%">
      <feFlood flood-color="#ffffff" flood-opacity="0.9" result="bg"/>
      <feMorphology operator="dilate" radius="1" in="SourceAlpha" result="outline"/>
      <feComposite in="bg" in2="outline" operator="in" result="coloredOutline"/>
      <feMerge>
        <feMergeNode in="coloredOutline"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Hexagon Container -->
  <g transform="translate(10, 10)">
    <!-- Outer Hexagon -->
    <polygon points="130,20 220,70 220,170 130,220 40,170 40,70" 
             fill="#0B192C" stroke="#1E3E62" stroke-width="6" stroke-linejoin="round"/>
    
    <!-- Central Dark Disc -->
    <circle cx="130" cy="120" r="72" fill="#030609"/>
    
    <!-- Circuit Traces & Nodes -->
    <g stroke="#00D2FC" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Trace Top-Right -->
      <path d="M 130,48 L 130,70 L 190,95"/>
      <circle cx="190" cy="95" r="4" fill="#00D2FC"/>
      
      <!-- Trace Left -->
      <path d="M 58,110 L 85,110 L 100,95"/>
      <circle cx="58" cy="110" r="4" fill="#00D2FC"/>

      <!-- Trace Bottom-Right -->
      <path d="M 130,192 L 130,165 L 180,140"/>
      <circle cx="180" cy="140" r="4" fill="#00D2FC"/>

      <!-- Trace Bottom-Left -->
      <path d="M 85,160 L 105,160 L 115,145"/>
      <circle cx="85" cy="160" r="4" fill="#00D2FC"/>
    </g>

    <!-- Central Microchip Component -->
    <g transform="translate(100, 90)">
      <!-- Chip Body -->
      <rect x="0" y="0" width="60" height="60" rx="8" fill="#164863" stroke="#00D2FC" stroke-width="3"/>
      
      <!-- Pins Top -->
      <line x1="15" y1="0" x2="15" y2="-6" stroke="#00D2FC" stroke-width="3" stroke-linecap="round"/>
      <line x1="30" y1="0" x2="30" y2="-6" stroke="#00D2FC" stroke-width="3" stroke-linecap="round"/>
      <line x1="45" y1="0" x2="45" y2="-6" stroke="#00D2FC" stroke-width="3" stroke-linecap="round"/>
      
      <!-- Pins Bottom -->
      <line x1="15" y1="60" x2="15" y2="66" stroke="#00D2FC" stroke-width="3" stroke-linecap="round"/>
      <line x1="30" y1="60" x2="30" y2="66" stroke="#00D2FC" stroke-width="3" stroke-linecap="round"/>
      <line x1="45" y1="60" x2="45" y2="66" stroke="#00D2FC" stroke-width="3" stroke-linecap="round"/>
      
      <!-- Pins Left -->
      <line x1="0" y1="15" x2="-6" y2="15" stroke="#00D2FC" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="30" x2="-6" y2="30" stroke="#00D2FC" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="45" x2="-6" y2="45" stroke="#00D2FC" stroke-width="3" stroke-linecap="round"/>
      
      <!-- Pins Right -->
      <line x1="60" y1="15" x2="66" y2="15" stroke="#00D2FC" stroke-width="3" stroke-linecap="round"/>
      <line x1="60" y1="30" x2="66" y2="30" stroke="#00D2FC" stroke-width="3" stroke-linecap="round"/>
      <line x1="60" y1="45" x2="66" y2="45" stroke="#00D2FC" stroke-width="3" stroke-linecap="round"/>

      <!-- Inner Core -->
      <rect x="12" y="12" width="36" height="36" rx="4" fill="#00D2FC" fill-opacity="0.25" stroke="#00D2FC" stroke-width="2"/>
    </g>
  </g>

  <!-- Typography & Subtitle -->
  <g transform="translate(280, 0)">
    <!-- Title: RPi-Monitor with multi-theme adaptive filter -->
    <text x="0" y="115" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="78" 
          font-weight="800" 
          fill="#1e293b" 
          filter="url(#theme-outline)">RPi-Monitor</text>
          
    <!-- Subtitle -->
    <text x="5" y="170" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="24" 
          font-weight="500" 
          fill="#334155" 
          letter-spacing="1.5" 
          filter="url(#subtitle-outline)">Real time monitoring for embedded devices</text>
  </g>
</svg>
