name: Tests

on: [push, pull_request]

jobs:
  test-e2e:
    name: Test end-to-end suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bubblewrap \
            libfile-which-perl \
            libhttp-daemon-perl \
            libipc-sharelite-perl \
            libjson-perl \
            librrds-perl \
            libsnmp-extension-passpersist-perl \
            perl \
            procps \
            rrdtool

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run end-to-end tests
        run: |
          if sudo env \
            "HOME=$HOME" \
            "PATH=$PATH" \
            "CARGO_HOME=$CARGO_HOME" \
            "RUSTUP_HOME=$HOME/.rustup" \
            cargo test --manifest-path tests/rust-e2e/Cargo.toml; then
            test_status=0
          else
            test_status=$?
          fi

          if [ -d tests/rust-e2e/target ]; then
            sudo chown -R "$(id -u):$(id -g)" tests/rust-e2e/target
          fi
          exit "$test_status"

  test-installer:
    name: Test install.sh (${{ matrix.os }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os:
          - debian:12-slim
          - debian:13-slim
          - ubuntu:22.04
          - ubuntu:24.04
          - ubuntu:26.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Bats test suite with Docker
        env:
          BASE_IMAGE: ${{ matrix.os }}
        run: |
          ./tests/run.sh
