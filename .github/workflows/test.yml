name: Tests

on: [push, pull_request]

jobs:
  test-e2e:
    name: Test end-to-end suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bubblewrap \
            libdevel-cover-perl \
            libfile-which-perl \
            libhttp-daemon-perl \
            libipc-sharelite-perl \
            libjson-perl \
            librrds-perl \
            libsnmp-extension-passpersist-perl \
            perl \
            procps \
            rrdtool

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run end-to-end tests
        env:
          PERL_COVERAGE: 1
          PERL_COVERAGE_DB: ${{ github.workspace }}/tests/cover_db-ci
        run: cargo test --manifest-path tests/rust-e2e/Cargo.toml

  test-installer:
    name: Test install.sh (${{ matrix.os }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os:
          - debian:12-slim
          - debian:13-slim
          - ubuntu:22.04
          - ubuntu:24.04
          - ubuntu:26.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Bats test suite with Docker
        env:
          BASE_IMAGE: ${{ matrix.os }}
        run: |
          ./tests/run.sh
